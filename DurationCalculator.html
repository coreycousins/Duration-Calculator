<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duration">
<title>Duration</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

body {
background: #111113;
color: #fff;
font-family: ‘DM Sans’, -apple-system, sans-serif;
min-height: 100dvh;
display: flex;
flex-direction: column;
align-items: center;
padding: 44px 0 32px;
}

.title {
font-size: 17px;
font-weight: 600;
color: #fff;
margin-bottom: 20px;
letter-spacing: -0.01em;
}

/* Duration readout — now at TOP */
.readout {
text-align: center;
margin-bottom: 20px;
}

.readout-main {
font-size: 44px;
font-weight: 300;
letter-spacing: -0.03em;
line-height: 1;
}

.readout-sub {
font-size: 13px;
color: rgba(255,255,255,0.38);
margin-top: 4px;
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.04em;
}

.midnight {
font-size: 12px;
color: #ff9f0a;
margin-top: 5px;
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.05em;
opacity: 0;
transition: opacity 0.25s;
}
.midnight.show { opacity: 1; }

/* Dial */
.dial-wrap {
width: 310px;
height: 310px;
position: relative;
touch-action: none;
}

#dial {
width: 100%;
height: 100%;
overflow: visible;
touch-action: none;
}

/* Time labels BELOW the wheel */
.labels-row {
display: flex;
justify-content: space-evenly;
width: 100%;
max-width: 360px;
margin-top: 20px;
padding: 0 20px;
}

.lbl {
display: flex;
flex-direction: column;
align-items: center;
gap: 3px;
}

.lbl-name {
font-size: 11px;
font-weight: 600;
letter-spacing: 0.1em;
text-transform: uppercase;
}

.lbl-name.s { color: #5e9bf5; }
.lbl-name.e { color: #ff9f0a; }

.lbl-time {
font-size: 28px;
font-weight: 300;
letter-spacing: -0.02em;
color: #fff;
}

.hint {
margin-top: 18px;
font-size: 12px;
color: rgba(255,255,255,0.18);
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.04em;
text-align: center;
padding: 0 28px;
line-height: 1.6;
}

.slot-toolbar {
max-width: 360px;
margin: 16px auto 8px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
padding: 0 20px;
}

.slot-button {
background: rgba(255,255,255,0.04);
border: 1px solid rgba(255,255,255,0.08);
color: #fff;
padding: 9px 14px;
font-size: 12px;
letter-spacing: 0.12em;
text-transform: uppercase;
border-radius: 999px;
cursor: pointer;
}

.slot-button:hover {
background: rgba(255,255,255,0.08);
}

.slot-button-danger {
color: rgba(255,100,80,0.7);
border-color: rgba(255,80,60,0.2);
}
.slot-button-danger.confirming {
color: #ff6450;
border-color: rgba(255,80,60,0.45);
background: rgba(255,80,60,0.08);
}

.slot-summary {
font-size: 12px;
color: rgba(255,255,255,0.6);
font-family: ‘DM Mono’, monospace;
}

.slot-list {
max-width: 360px;
margin: 0 auto;
display: flex;
flex-direction: column;
gap: 5px;
padding: 0 20px;
}

.slot-row {
display: flex;
justify-content: space-between;
align-items: center;
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 10px;
padding: 7px 12px;
cursor: pointer;
}

.slot-row.selected {
border-color: rgba(94,155,245,0.6);
background: rgba(94,155,245,0.1);
}

.slot-row-label {
display: flex;
flex-direction: column;
gap: 2px;
}

.slot-row-title {
font-size: 12px;
font-weight: 500;
}

.slot-row-time {
font-size: 11px;
color: rgba(255,255,255,0.65);
font-family: ‘DM Mono’, monospace;
}

.slot-row-actions {
display: flex;
gap: 8px;
}

.slot-action {
background: rgba(255,255,255,0.04);
border: 1px solid rgba(255,255,255,0.08);
color: rgba(255,255,255,0.75);
padding: 6px 10px;
border-radius: 10px;
font-size: 11px;
cursor: pointer;
}

.slot-action:hover {
border-color: rgba(255,255,255,0.18);
}

.slot-rename-input {
background: rgba(255,255,255,0.06);
border: 1px solid rgba(94,155,245,0.5);
border-radius: 6px;
color: #fff;
font-family: 'DM Sans', sans-serif;
font-size: 13px;
font-weight: 500;
padding: 2px 7px;
outline: none;
width: 120px;
}

.daylight-row {
text-align: center;
margin-top: 14px;
}

.daylight-time {
font-size: 13px;
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.04em;
color: rgba(255,210,80,0.75);
}

.daylight-note {
font-size: 11px;
color: rgba(255,255,255,0.18);
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.04em;
margin-top: 4px;
}

/* ---- Schedule bar & panel ---- */
.schedule-bar {
display: flex;
align-items: center;
justify-content: space-between;
max-width: 360px;
margin: 14px auto 0;
padding: 0 20px;
}

.schedule-name {
font-size: 13px;
font-weight: 500;
color: rgba(255,255,255,0.75);
cursor: text;
}

.schedule-name-input {
background: transparent;
border: none;
border-bottom: 1px solid rgba(255,255,255,0.3);
color: rgba(255,255,255,0.85);
font-family: 'DM Sans', sans-serif;
font-size: 13px;
font-weight: 500;
outline: none;
width: 160px;
}

.schedule-toggle-btn {
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 8px;
color: rgba(255,255,255,0.45);
font-family: 'DM Sans', sans-serif;
font-size: 11px;
padding: 4px 10px;
cursor: pointer;
transition: background 0.12s, color 0.12s;
}

.schedule-toggle-btn:hover { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.75); }
.schedule-toggle-btn.active { background: rgba(94,155,245,0.15); border-color: rgba(94,155,245,0.4); color: rgba(255,255,255,0.9); }

/* Inline panel */
.schedule-panel {
max-width: 360px;
margin: 8px auto 0;
padding: 0 20px;
overflow: hidden;
max-height: 0;
transition: max-height 0.25s ease;
}

.schedule-panel.open { max-height: 600px; }

.schedule-panel-inner {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 12px;
overflow: hidden;
}

.schedule-panel-header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 9px 14px 7px;
border-bottom: 1px solid rgba(255,255,255,0.06);
}

.schedule-panel-title {
font-size: 10px;
font-weight: 600;
color: rgba(255,255,255,0.35);
letter-spacing: 0.08em;
text-transform: uppercase;
}

.schedule-panel-header-actions { display: flex; gap: 4px; }

.schedule-panel-meta-btn {
background: none;
border: 1px solid rgba(255,255,255,0.08);
border-radius: 6px;
color: rgba(255,255,255,0.3);
font-family: 'DM Sans', sans-serif;
font-size: 10px;
padding: 2px 8px;
cursor: pointer;
}

.schedule-panel-meta-btn:hover { color: rgba(255,255,255,0.65); background: rgba(255,255,255,0.05); }

.schedule-entry {
display: flex;
align-items: center;
padding: 8px 14px;
gap: 8px;
cursor: pointer;
border-bottom: 1px solid rgba(255,255,255,0.04);
transition: background 0.1s;
}

.schedule-entry:last-child { border-bottom: none; }
.schedule-entry:hover { background: rgba(255,255,255,0.04); }
.schedule-entry.active-entry { background: rgba(94,155,245,0.08); }

.schedule-entry-info { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }

.schedule-entry-name {
font-size: 12px;
font-weight: 500;
color: rgba(255,255,255,0.7);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.schedule-entry.active-entry .schedule-entry-name { color: rgba(255,255,255,0.95); }

.schedule-entry-date {
font-size: 9px;
color: rgba(255,255,255,0.2);
font-family: 'DM Mono', monospace;
}

.schedule-entry-name-input {
background: transparent;
border: none;
border-bottom: 1px solid rgba(255,255,255,0.3);
color: rgba(255,255,255,0.85);
font-family: 'DM Sans', sans-serif;
font-size: 12px;
font-weight: 500;
outline: none;
width: 130px;
}

.schedule-entry-actions { display: flex; gap: 5px; flex-shrink: 0; }

.schedule-entry-btn {
background: none;
border: 1px solid rgba(255,255,255,0.08);
border-radius: 6px;
color: rgba(255,255,255,0.35);
font-size: 10px;
padding: 2px 7px;
cursor: pointer;
}

.schedule-entry-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); }
.schedule-entry-btn:disabled { opacity: 0.25; cursor: default; }
.schedule-entry-btn.danger { border-color: rgba(255,69,58,0.25); color: rgba(255,69,58,0.5); }
.schedule-entry-btn.danger:hover:not(:disabled) { background: rgba(255,69,58,0.1); color: rgba(255,69,58,0.9); }

.schedule-panel-footer {
display: flex;
gap: 8px;
padding: 9px 14px;
border-top: 1px solid rgba(255,255,255,0.06);
}

.schedule-footer-btn {
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 8px;
color: rgba(255,255,255,0.45);
font-family: 'DM Sans', sans-serif;
font-size: 11px;
padding: 4px 12px;
cursor: pointer;
transition: background 0.12s, color 0.12s;
}

.schedule-footer-btn:hover { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.8); }

/* Drawer mode overrides */
body.drawer-mode .schedule-panel {
position: fixed;
top: 0; right: 0; bottom: 0;
width: 280px;
max-width: 88vw;
max-height: none !important;
padding: 0;
margin: 0;
transform: translateX(110%);
transition: transform 0.25s ease;
z-index: 200;
overflow-y: auto;
}

body.drawer-mode .schedule-panel.open { transform: translateX(0); max-height: none !important; }

body.drawer-mode .schedule-panel-inner {
border-radius: 0;
border: none;
border-left: 1px solid rgba(255,255,255,0.1);
min-height: 100%;
background: #161618;
}

.schedule-backdrop {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.5);
z-index: 199;
}

.schedule-backdrop.visible { display: block; }

.slot-row.spillover {
border-color: rgba(255,255,255,0.05);
background: rgba(255,255,255,0.015);
opacity: 0.65;
}

.slot-row-spillover-tag {
font-size: 9px;
color: rgba(255,159,10,0.7);
font-family: 'DM Mono', monospace;
letter-spacing: 0.05em;
text-transform: uppercase;
}

.day-tabs-wrap {
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
margin: 14px 0 8px;
padding: 0 20px;
}

.day-tabs {
display: flex;
gap: 4px;
}

.day-tab {
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 8px;
color: rgba(255,255,255,0.4);
font-family: 'DM Sans', sans-serif;
font-size: 11px;
font-weight: 500;
padding: 4px 8px;
cursor: pointer;
letter-spacing: 0.03em;
transition: background 0.12s, color 0.12s, border-color 0.12s;
}

.day-tab:hover {
background: rgba(255,255,255,0.09);
color: rgba(255,255,255,0.7);
}

.day-tab.active {
background: rgba(94,155,245,0.2);
border-color: rgba(94,155,245,0.55);
color: rgba(255,255,255,0.9);
}

.day-tab.has-slots:not(.active)::after {
content: '';
display: inline-block;
width: 4px;
height: 4px;
border-radius: 50%;
background: rgba(255,159,10,0.7);
margin-left: 5px;
vertical-align: middle;
position: relative;
top: -1px;
}

.day-copy-btn {
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 8px;
color: rgba(255,255,255,0.4);
font-family: 'DM Sans', sans-serif;
font-size: 11px;
padding: 4px 10px;
cursor: pointer;
transition: background 0.12s, color 0.12s;
}

.day-copy-btn:hover:not(:disabled) {
background: rgba(255,255,255,0.09);
color: rgba(255,255,255,0.7);
}

.day-copy-btn:disabled {
opacity: 0.3;
cursor: default;
}
</style>

</head>
<body>

<div class="title">Duration</div>

<!-- Times ABOVE the wheel -->

<div class="labels-row" style="margin-bottom:20px;margin-top:0;">
  <div class="lbl">
    <div class="lbl-name s">▶ Start</div>
    <div class="lbl-time" id="lblStart2">9:00 AM</div>
  </div>
  <div class="lbl">
    <div class="lbl-name e">■ End</div>
    <div class="lbl-time" id="lblEnd2">10:30 AM</div>
  </div>
</div>

<div class="dial-wrap">
<svg id="dial" viewBox="-8 -8 326 326" xmlns="http://www.w3.org/2000/svg">

  <!-- Background ring -->

  <circle cx="155" cy="155" r="120" fill="none" stroke="#2d2d31" stroke-width="30"/>

  <!-- Night shade arc (sunrise–sunset shading) -->

  <path id="nightArc" fill="none" stroke="#0e0e11" stroke-width="30" stroke-linecap="butt" pointer-events="none" style="display:none"/>

  <!-- Sunrise / sunset markers -->

  <g id="sunMarkers"></g>

  <!-- Arc body — wide hit area for "slide whole arc" dragging -->

  <path id="arcHit" fill="none" stroke="transparent" stroke-width="44" stroke-linecap="butt" style="cursor:grab"/>

  <!-- Visible arc -->

  <path id="arcFill" fill="none" stroke="#ff9f0a" stroke-width="30" stroke-linecap="butt" pointer-events="none"/>

  <!-- Tick marks over arc -->

<g id="ticks"></g>
  <g id="slotArcs"></g>
  <g id="slotLabels"></g>

  <!-- Hour labels -->

<g id="hrLabels" text-anchor="middle" dominant-baseline="central"
font-family="DM Sans, sans-serif" font-size="11" fill="rgba(255,255,255,0.55)"></g>

  <!-- Start handle (blue) -->

  <circle id="hs" r="10" fill="#1c1c1e" stroke="#5e9bf5" stroke-width="2" style="cursor:grab"/>
  <circle id="hsDot" r="3" fill="#5e9bf5" pointer-events="none"/>

  <!-- End handle (orange) -->

  <circle id="he" r="10" fill="#1c1c1e" stroke="#ff9f0a" stroke-width="2" style="cursor:grab"/>
  <circle id="heDot" r="3" fill="#ff9f0a" pointer-events="none"/>

  <!-- Arc midpoint grab stick -->

  <line id="stickLine" stroke="#ff9f0a" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round" pointer-events="none"/>
  <circle id="stickHandle" r="9" fill="#1c1c1e" stroke="#ff9f0a" stroke-width="2" style="cursor:grab"/>
  <circle id="stickDot" r="3" fill="#ff9f0a" pointer-events="none"/>

</svg>
</div>

<!-- Duration BELOW the wheel -->

<div class="readout" style="margin-top:20px;">
  <div class="readout-main" id="durMain">1 hr 30 min</div>
  <div class="readout-sub" id="durSub">90 minutes total</div>
  <div class="midnight" id="midnight">↺ crosses midnight</div>
</div>

<div class="schedule-bar">
  <span id="scheduleNameDisplay" class="schedule-name" ondblclick="renameActiveSchedule()">My Schedule</span>
  <button class="schedule-toggle-btn" id="schedulesBtn" onclick="toggleSchedulePanel()">Schedules ▾</button>
</div>

<div class="schedule-panel" id="schedulePanel">
  <div class="schedule-panel-inner">
    <div class="schedule-panel-header">
      <span class="schedule-panel-title">Saved Schedules</span>
      <div class="schedule-panel-header-actions">
        <button class="schedule-panel-meta-btn" id="panelModeBtn" onclick="togglePanelMode()">→ Drawer</button>
        <button class="schedule-panel-meta-btn" onclick="closeSchedulePanel()">✕</button>
      </div>
    </div>
    <div id="schedulePanelList"></div>
    <div class="schedule-panel-footer">
      <button class="schedule-footer-btn" onclick="newSchedule()">+ New</button>
      <label class="schedule-footer-btn" style="cursor:pointer;">
        Import…
        <input type="file" accept=".json" onchange="importScheduleFile(this)" style="display:none">
      </label>
    </div>
  </div>
</div>

<div class="day-tabs-wrap">
  <div class="day-tabs" id="dayTabs">
    <button class="day-tab" data-day="Mon" onclick="switchDay('Mon')">Mon</button>
    <button class="day-tab" data-day="Tue" onclick="switchDay('Tue')">Tue</button>
    <button class="day-tab" data-day="Wed" onclick="switchDay('Wed')">Wed</button>
    <button class="day-tab" data-day="Thu" onclick="switchDay('Thu')">Thu</button>
    <button class="day-tab" data-day="Fri" onclick="switchDay('Fri')">Fri</button>
    <button class="day-tab" data-day="Sat" onclick="switchDay('Sat')">Sat</button>
    <button class="day-tab" data-day="Sun" onclick="switchDay('Sun')">Sun</button>
  </div>
  <button class="day-copy-btn" id="dayCopyBtn" onclick="copyDayForward()">Copy →</button>
</div>

<div class="slot-toolbar">
  <button class="slot-button" id="addSlotBtn" onclick="addSlot()">+ Add slot</button>
  <div class="slot-summary" id="slotSummary">1 slot · 1 hr 30 min total</div>
  <button class="slot-button slot-button-danger" id="deleteAllBtn" onclick="requestDeleteAll()">Clear day</button>
</div>
<div id="slotList" class="slot-list"></div>

<div class="daylight-row">
  <div class="daylight-time" id="daylightTime"></div>
  <div class="daylight-note" id="daylightNote">daylight time requires sharing your location</div>
</div>

<div class="hint">Drag handles to change start/end · drag the arc to shift both</div>

<div style="margin-top:14px;font-size:10px;color:rgba(255,255,255,0.15);font-family:'DM Mono',monospace;letter-spacing:0.06em;">v2.1</div>

<script>
const CX = 155, CY = 155, R = 120;
const TAU = Math.PI * 2;
const SNAP = 15; // minutes

const SCHEDULES_KEY = 'durationSchedules';
const DEFAULT_SLOT_LENGTH = 120;
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const _data = loadAllSchedules();
let scheduleList = _data.schedules;
let activeScheduleId = _data.active;
let panelMode = _data.panelMode || 'inline';
let schedulePanelOpen = false;

const _activeEntry = scheduleList.find(s => s.id === activeScheduleId) || scheduleList[0];
let schedule = _activeEntry.schedule;
let currentDay = _activeEntry.currentDay || 'Mon';
let slots = schedule[currentDay];
let selectedSlotId = slots.length ? slots[0].id : null;

// Sun times (null until geolocation resolves)
let sunriseMins = null;
let sunsetMins  = null;

// Drag state
// mode: null | 'start' | 'end' | 'arc'
let dragMode = null;
let dragStartAngle = 0;   // angle at pointer-down
let dragStartSM = 0;      // selected slot start at pointer-down
let dragStartEM = 0;      // selected slot end at pointer-down

// ---- Math helpers ----
function minsToAngle(m) {
  return (((m % 1440) + 1440) % 1440 / 1440) * TAU - Math.PI / 2;
}

function angleToMins(a) {
  let norm = ((a + Math.PI / 2) % TAU + TAU) % TAU;
  return (norm / TAU) * 1440;
}

function snapTo(m) {
  return Math.round(m / SNAP) * SNAP % 1440;
}

function polar(a, r) {
  r = (r === undefined) ? R : r;
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
}

function angleDiff(a, b) {
  // Signed shortest rotation from b to a (clockwise positive)
  let d = ((a - b) % TAU + TAU) % TAU;
  if (d > Math.PI) d -= TAU;
  return d;
}

// Duration in minutes going clockwise from start to end (always 1..1439)
function getDuration(slot) {
  if (!slot) return 0;
  let d = slot.endMins - slot.startMins;
  if (d <= 0) d += 1440;
  return d;
}

// ---- Format helpers ----
function formatTime(m) {
  m = ((m % 1440) + 1440) % 1440;
  const h24 = Math.floor(m / 60);
  const min = m % 60;
  const ampm = h24 < 12 ? 'AM' : 'PM';
  const h = h24 % 12 || 12;
  return `${h}:${String(min).padStart(2,'0')} ${ampm}`;
}

function formatDur(m) {
  m = ((m % 1440) + 1440) % 1440;
  const h = Math.floor(m / 60), mm = m % 60;
  if (!h) return `${mm} min`;
  if (!mm) return `${h} hr`;
  return `${h} hr ${mm} min`;
}

function loadAllSchedules() {
  const emptyDays = () => { const s = {}; DAYS.forEach(d => { s[d] = []; }); return s; };
  const makeEntry = (name, sched, day) => ({
    id: String(Date.now() + Math.floor(Math.random() * 1000)),
    name, modified: new Date().toISOString(), currentDay: day || 'Mon', schedule: sched
  });
  const ensureDays = (sched) => { DAYS.forEach(d => { if (!Array.isArray(sched[d])) sched[d] = []; }); return sched; };

  try {
    const raw = localStorage.getItem(SCHEDULES_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.schedules) && data.schedules.length) {
        data.schedules.forEach(e => ensureDays(e.schedule));
        return { schedules: data.schedules, active: data.active || data.schedules[0].id, panelMode: data.panelMode || 'inline' };
      }
    }
  } catch (_) {}

  // Migrate from old single-schedule key
  try {
    const raw = localStorage.getItem('durationSlots');
    if (raw) {
      const parsed = JSON.parse(raw);
      const days = emptyDays();
      let day = 'Mon';
      if (parsed && parsed.schedule) {
        DAYS.forEach(d => { if (Array.isArray(parsed.schedule[d])) days[d] = parsed.schedule[d]; });
        day = parsed.currentDay || 'Mon';
      } else if (Array.isArray(parsed) && parsed.length) {
        days['Mon'] = parsed;
      }
      const entry = makeEntry('My Schedule', days, day);
      return { schedules: [entry], active: entry.id, panelMode: 'inline' };
    }
  } catch (_) {}

  const days = emptyDays();
  days['Mon'] = [{ id: Date.now(), label: 'Slot 1', startMins: 9 * 60, endMins: 10 * 60 + 30 }];
  const entry = makeEntry('My Schedule', days, 'Mon');
  return { schedules: [entry], active: entry.id, panelMode: 'inline' };
}

function saveAllSchedules() {
  localStorage.setItem(SCHEDULES_KEY, JSON.stringify({ schedules: scheduleList, active: activeScheduleId, panelMode }));
}

function saveSlots() {
  slots.sort((a, b) => a.startMins - b.startMins);
  const active = scheduleList.find(s => s.id === activeScheduleId);
  if (active) active.modified = new Date().toISOString();
  saveAllSchedules();
}

function getSelectedSlot() {
  if (selectedSlotId === null) return null;
  let slot = slots.find(s => s.id === selectedSlotId);
  if (!slot && slots.length) { slot = slots[0]; selectedSlotId = slot.id; }
  return slot || null;
}

function getDurationForSlot(slot) {
  let d = slot.endMins - slot.startMins;
  if (d <= 0) d += 1440;
  return d;
}

function findNextSlotStart() {
  if (!slots.length) return 8 * 60;
  const latestEnd = Math.max(...slots.map(s => s.endMins));
  const candidate = snapTo(latestEnd + 30);
  if (candidate + DEFAULT_SLOT_LENGTH <= 1439) return candidate;
  return 8 * 60;
}

function addSlot() {
  const nextStart = findNextSlotStart();
  const start = nextStart;
  const end = snapTo((nextStart + DEFAULT_SLOT_LENGTH) % 1440);
  const nextNum = slots.length + 1;
  const slot = { id: Date.now(), label: `Slot ${nextNum}`, startMins: start, endMins: end };
  slots.push(slot);
  selectedSlotId = slot.id;
  saveSlots();
  updateSlotList();
  render();
}

function selectSlot(id) {
  selectedSlotId = id;
  updateSlotList();
  render();
}

function deleteSlot(id, event) {
  event.stopPropagation();
  const idx = slots.findIndex(s => s.id === id);
  if (idx !== -1) slots.splice(idx, 1);
  if (selectedSlotId === id) selectedSlotId = slots[0]?.id || null;
  saveSlots();
  updateSlotList();
  render();
}

function triggerRename(titleSpan, slot) {
  if (!titleSpan) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = slot.label;
  input.className = 'slot-rename-input';
  titleSpan.replaceWith(input);
  input.focus();
  input.select();
  const save = () => { const v = input.value.trim(); if (v) slot.label = v; saveSlots(); updateSlotList(); };
  input.onblur = save;
  input.onkeydown = (ev) => { if (ev.key === 'Enter') input.blur(); if (ev.key === 'Escape') updateSlotList(); };
}

let pendingRenameId = null;
let deleteAllConfirming = false;
let deleteAllTimer = null;

function requestDeleteAll() {
  const btn = document.getElementById('deleteAllBtn');
  if (deleteAllConfirming) {
    clearTimeout(deleteAllTimer);
    deleteAllConfirming = false;
    slots.length = 0;
    selectedSlotId = null;
    saveSlots();
    updateSlotList();
    render();
    btn.textContent = 'Clear day';
    btn.classList.remove('confirming');
  } else {
    deleteAllConfirming = true;
    btn.textContent = `Clear ${currentDay}?`;
    btn.classList.add('confirming');
    deleteAllTimer = setTimeout(() => {
      deleteAllConfirming = false;
      btn.textContent = 'Clear day';
      btn.classList.remove('confirming');
    }, 3000);
  }
}

function switchDay(day) {
  if (deleteAllConfirming) {
    clearTimeout(deleteAllTimer);
    deleteAllConfirming = false;
    const btn = document.getElementById('deleteAllBtn');
    btn.textContent = 'Clear day';
    btn.classList.remove('confirming');
  }
  currentDay = day;
  slots = schedule[currentDay];
  selectedSlotId = slots.length ? slots[0].id : null;
  const _ae = scheduleList.find(s => s.id === activeScheduleId);
  if (_ae) _ae.currentDay = day;
  saveAllSchedules();
  updateDayTabs();
  updateSlotList();
  render();
}

function copyDayForward() {
  if (!slots.length) return;
  const nextDay = DAYS[(DAYS.indexOf(currentDay) + 1) % DAYS.length];
  const now = Date.now();
  schedule[nextDay] = slots.map((s, i) => ({ ...s, id: now + i }));
  switchDay(nextDay);
}

function updateDayTabs() {
  DAYS.forEach(d => {
    const btn = document.querySelector(`.day-tab[data-day="${d}"]`);
    if (!btn) return;
    btn.classList.toggle('active', d === currentDay);
    btn.classList.toggle('has-slots', schedule[d].length > 0);
  });
  const nextDay = DAYS[(DAYS.indexOf(currentDay) + 1) % DAYS.length];
  const copyBtn = document.getElementById('dayCopyBtn');
  if (copyBtn) {
    copyBtn.textContent = `Copy → ${nextDay}`;
    copyBtn.disabled = slots.length === 0;
  }
}

// ---- Schedule management ----

function deduplicateName(name) {
  const existing = new Set(scheduleList.map(s => s.name));
  if (!existing.has(name)) return name;
  let n = 2;
  while (existing.has(`${name} (${n})`)) n++;
  return `${name} (${n})`;
}

function switchSchedule(id) {
  const entry = scheduleList.find(s => s.id === id);
  if (!entry) return;
  activeScheduleId = id;
  schedule = entry.schedule;
  currentDay = entry.currentDay || 'Mon';
  slots = schedule[currentDay];
  selectedSlotId = slots.length ? slots[0].id : null;
  saveAllSchedules();
  closeSchedulePanel();
  updateScheduleBar();
  updateDayTabs();
  updateSlotList();
  render();
}

function newSchedule() {
  const emptyDays = () => { const s = {}; DAYS.forEach(d => { s[d] = []; }); return s; };
  const entry = {
    id: String(Date.now()),
    name: deduplicateName('New Schedule'),
    modified: new Date().toISOString(),
    currentDay: 'Mon',
    schedule: emptyDays()
  };
  scheduleList.push(entry);
  switchSchedule(entry.id);
}

function deleteScheduleEntry(id) {
  if (scheduleList.length <= 1) return;
  const idx = scheduleList.findIndex(s => s.id === id);
  if (idx === -1) return;
  scheduleList.splice(idx, 1);
  if (activeScheduleId === id) {
    const next = scheduleList[Math.max(0, idx - 1)];
    switchSchedule(next.id);
  } else {
    saveAllSchedules();
    updateSchedulePanel();
  }
}

function exportSchedule(id) {
  const entry = scheduleList.find(s => s.id === id);
  if (!entry) return;
  const data = { format: 'duration-calculator', version: '1', name: entry.name, exported: new Date().toISOString().slice(0, 10), schedule: entry.schedule };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${entry.name.replace(/[^a-z0-9]/gi, '-').toLowerCase()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importScheduleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.format !== 'duration-calculator' || !data.schedule) { alert('Not a valid Duration Calculator schedule file.'); return; }
      const emptyDays = () => { const s = {}; DAYS.forEach(d => { s[d] = []; }); return s; };
      const days = emptyDays();
      DAYS.forEach(d => { if (Array.isArray(data.schedule[d])) days[d] = data.schedule[d]; });
      const entry = { id: String(Date.now()), name: deduplicateName(data.name || 'Imported Schedule'), modified: new Date().toISOString(), currentDay: 'Mon', schedule: days };
      scheduleList.push(entry);
      switchSchedule(entry.id);
    } catch (_) { alert('Could not read the schedule file.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function toggleSchedulePanel() {
  schedulePanelOpen = !schedulePanelOpen;
  document.getElementById('schedulePanel').classList.toggle('open', schedulePanelOpen);
  document.getElementById('scheduleBackdrop').classList.toggle('visible', schedulePanelOpen && panelMode === 'drawer');
  document.getElementById('schedulesBtn').classList.toggle('active', schedulePanelOpen);
  if (schedulePanelOpen) updateSchedulePanel();
}

function closeSchedulePanel() {
  schedulePanelOpen = false;
  document.getElementById('schedulePanel')?.classList.remove('open');
  document.getElementById('scheduleBackdrop')?.classList.remove('visible');
  document.getElementById('schedulesBtn')?.classList.remove('active');
}

function togglePanelMode() {
  panelMode = panelMode === 'inline' ? 'drawer' : 'inline';
  if (panelMode === 'drawer') document.body.classList.add('drawer-mode');
  else document.body.classList.remove('drawer-mode');
  document.getElementById('scheduleBackdrop').classList.toggle('visible', schedulePanelOpen && panelMode === 'drawer');
  document.getElementById('panelModeBtn').textContent = panelMode === 'inline' ? '→ Drawer' : '← Inline';
  saveAllSchedules();
}

function updateScheduleBar() {
  const entry = scheduleList.find(s => s.id === activeScheduleId);
  const el = document.getElementById('scheduleNameDisplay');
  if (el && entry) el.textContent = entry.name;
  if (panelMode === 'drawer') document.body.classList.add('drawer-mode');
  else document.body.classList.remove('drawer-mode');
}

function renameActiveSchedule() {
  const nameEl = document.getElementById('scheduleNameDisplay');
  if (!nameEl) return;
  const entry = scheduleList.find(s => s.id === activeScheduleId);
  if (!entry) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = entry.name;
  input.className = 'schedule-name-input';
  nameEl.replaceWith(input);
  input.focus(); input.select();
  const save = () => {
    const v = input.value.trim();
    if (v) entry.name = v;
    saveAllSchedules();
    const newEl = document.createElement('span');
    newEl.id = 'scheduleNameDisplay'; newEl.className = 'schedule-name';
    newEl.textContent = entry.name; newEl.ondblclick = renameActiveSchedule;
    input.replaceWith(newEl);
  };
  input.onblur = save;
  input.onkeydown = (ev) => {
    if (ev.key === 'Enter') input.blur();
    if (ev.key === 'Escape') { input.value = entry.name; input.blur(); }
  };
}

function updateSchedulePanel() {
  const list = document.getElementById('schedulePanelList');
  if (!list) return;
  list.innerHTML = '';
  scheduleList.forEach(entry => {
    const row = document.createElement('div');
    row.className = `schedule-entry${entry.id === activeScheduleId ? ' active-entry' : ''}`;
    row.onclick = () => { if (entry.id !== activeScheduleId) switchSchedule(entry.id); };

    const info = document.createElement('div');
    info.className = 'schedule-entry-info';
    const nameEl = document.createElement('span');
    nameEl.className = 'schedule-entry-name';
    nameEl.textContent = entry.name;
    const dateEl = document.createElement('span');
    dateEl.className = 'schedule-entry-date';
    dateEl.textContent = entry.modified ? entry.modified.slice(0, 10) : '';
    info.appendChild(nameEl); info.appendChild(dateEl);

    const actions = document.createElement('div');
    actions.className = 'schedule-entry-actions';

    const renBtn = document.createElement('button');
    renBtn.className = 'schedule-entry-btn'; renBtn.textContent = '✎'; renBtn.title = 'Rename';
    renBtn.onclick = (e) => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.type = 'text'; input.value = entry.name; input.className = 'schedule-entry-name-input';
      nameEl.replaceWith(input); input.focus(); input.select();
      const save = () => {
        const v = input.value.trim(); if (v) entry.name = v;
        nameEl.textContent = entry.name; input.replaceWith(nameEl);
        saveAllSchedules();
        if (entry.id === activeScheduleId) updateScheduleBar();
      };
      input.onblur = save;
      input.onkeydown = (ev) => { if (ev.key === 'Enter') input.blur(); if (ev.key === 'Escape') { input.value = entry.name; input.blur(); } };
    };

    const expBtn = document.createElement('button');
    expBtn.className = 'schedule-entry-btn'; expBtn.textContent = '↓'; expBtn.title = 'Export';
    expBtn.onclick = (e) => { e.stopPropagation(); exportSchedule(entry.id); };

    const delBtn = document.createElement('button');
    delBtn.className = 'schedule-entry-btn danger'; delBtn.textContent = '✕'; delBtn.title = 'Delete';
    delBtn.disabled = scheduleList.length <= 1;
    delBtn.onclick = (e) => {
      e.stopPropagation();
      if (scheduleList.length <= 1) return;
      if (delBtn.dataset.confirming) {
        clearTimeout(Number(delBtn.dataset.timer));
        deleteScheduleEntry(entry.id);
      } else {
        delBtn.dataset.confirming = '1'; delBtn.textContent = '?';
        delBtn.dataset.timer = setTimeout(() => { delete delBtn.dataset.confirming; delBtn.textContent = '✕'; }, 2000);
      }
    };

    actions.appendChild(renBtn); actions.appendChild(expBtn); actions.appendChild(delBtn);
    row.appendChild(info); row.appendChild(actions);
    list.appendChild(row);
  });
  const modeBtn = document.getElementById('panelModeBtn');
  if (modeBtn) modeBtn.textContent = panelMode === 'inline' ? '→ Drawer' : '← Inline';
}

function updateSlotList() {
  const container = document.getElementById('slotList');
  const summary = document.getElementById('slotSummary');
  container.innerHTML = '';

  const prevDay = DAYS[(DAYS.indexOf(currentDay) - 1 + DAYS.length) % DAYS.length];
  getSpilloverSlots().forEach(slot => {
    const row = document.createElement('div');
    row.className = 'slot-row spillover';
    row.title = `From ${prevDay} — click to go there`;
    row.onclick = () => switchDay(prevDay);

    const label = document.createElement('div');
    label.className = 'slot-row-label';

    const titleSpan = document.createElement('span');
    titleSpan.className = 'slot-row-title';
    titleSpan.textContent = slot.label;

    const tag = document.createElement('span');
    tag.className = 'slot-row-spillover-tag';
    tag.textContent = `← ${prevDay}`;

    const timeSpan = document.createElement('span');
    timeSpan.className = 'slot-row-time';
    timeSpan.textContent = `12:00 AM – ${formatTime(slot.endMins)} · ${formatDur(slot.endMins)}`;

    label.appendChild(titleSpan);
    label.appendChild(tag);
    label.appendChild(timeSpan);
    row.appendChild(label);
    container.appendChild(row);
  });

  const sorted = [...slots].sort((a, b) => a.startMins - b.startMins);
  sorted.forEach(slot => {
    const row = document.createElement('div');
    row.className = `slot-row${slot.id === selectedSlotId ? ' selected' : ''}`;
    row.onclick = () => selectSlot(slot.id);
    row.ondblclick = (e) => { e.stopPropagation(); pendingRenameId = slot.id; selectSlot(slot.id); };

    const label = document.createElement('div');
    label.className = 'slot-row-label';

    const titleSpan = document.createElement('span');
    titleSpan.className = 'slot-row-title';
    titleSpan.textContent = slot.label;

    const timeSpan = document.createElement('span');
    timeSpan.className = 'slot-row-time';
    timeSpan.textContent = `${formatTime(slot.startMins)} – ${formatTime(slot.endMins)} · ${formatDur(getDurationForSlot(slot))}`;

    label.appendChild(titleSpan);
    label.appendChild(timeSpan);

    const actions = document.createElement('div');
    actions.className = 'slot-row-actions';

    const ren = document.createElement('button');
    ren.className = 'slot-action';
    ren.textContent = '✎';
    ren.onclick = (e) => { e.stopPropagation(); triggerRename(titleSpan, slot); };

    const del = document.createElement('button');
    del.className = 'slot-action';
    del.textContent = 'Delete';
    del.onclick = (e) => deleteSlot(slot.id, e);

    actions.appendChild(ren);
    actions.appendChild(del);
    row.appendChild(label);
    row.appendChild(actions);
    container.appendChild(row);

    if (slot.id === pendingRenameId) {
      pendingRenameId = null;
      triggerRename(titleSpan, slot);
    }
  });

  const total = slots.reduce((sum, s) => sum + getDurationForSlot(s), 0);
  summary.textContent = `${slots.length} slot${slots.length !== 1 ? 's' : ''} · ${formatDur(total)} total`;
  updateDayTabs();
}

function buildSlotPath(slot) {
  const sm = slot.startMins;
  const em = slot.endMins;
  const aS = minsToAngle(sm);
  const aE = minsToAngle(em);
  const spanMins = getDurationForSlot(slot);
  const largeArc = spanMins > 720 ? 1 : 0;
  const p1 = polar(aS);
  const p2 = polar(aE);
  return `M ${p1.x} ${p1.y} A ${R} ${R} 0 ${largeArc} 1 ${p2.x} ${p2.y}`;
}

function getSpilloverSlots() {
  const prevDay = DAYS[(DAYS.indexOf(currentDay) - 1 + DAYS.length) % DAYS.length];
  return schedule[prevDay].filter(s => s.endMins < s.startMins);
}

function drawSlotArcs() {
  const g = document.getElementById('slotArcs');
  g.innerHTML = '';

  // Spillover arcs from previous day (non-interactive, muted)
  getSpilloverSlots().forEach(slot => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', buildSlotPath({ startMins: 0, endMins: slot.endMins }));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(255,159,10,0.18)');
    path.setAttribute('stroke-width', '30');
    path.setAttribute('stroke-linecap', 'butt');
    path.setAttribute('pointer-events', 'none');
    g.appendChild(path);
  });

  // Current day unselected arcs
  slots.forEach(slot => {
    if (slot.id === selectedSlotId) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', buildSlotPath(slot));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'rgba(255,159,10,0.32)');
    path.setAttribute('stroke-width', '30');
    path.setAttribute('stroke-linecap', 'butt');
    path.setAttribute('cursor', 'pointer');
    path.setAttribute('pointer-events', 'stroke');
    path.onclick = () => selectSlot(slot.id);
    path.onmouseover = () => path.setAttribute('stroke', 'rgba(255,159,10,0.55)');
    path.onmouseout = () => path.setAttribute('stroke', 'rgba(255,159,10,0.32)');
    g.appendChild(path);
  });

  // Boundary ticks — current day slots + spillover boundaries
  const tickInner = 101;
  const tickOuter = 139;
  const drawn = new Set();
  const addTick = (mins) => {
    const key = ((mins % 1440) + 1440) % 1440;
    if (drawn.has(key)) return;
    drawn.add(key);
    const a = minsToAngle(key);
    const p1 = polar(a, tickInner);
    const p2 = polar(a, tickOuter);
    const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    tick.setAttribute('x1', p1.x); tick.setAttribute('y1', p1.y);
    tick.setAttribute('x2', p2.x); tick.setAttribute('y2', p2.y);
    tick.setAttribute('stroke', 'rgba(255,255,255,0.6)');
    tick.setAttribute('stroke-width', '2');
    tick.setAttribute('stroke-linecap', 'square');
    tick.setAttribute('pointer-events', 'none');
    g.appendChild(tick);
  };
  slots.forEach(slot => {
    addTick(slot.startMins);
    addTick((slot.startMins + getDurationForSlot(slot)) % 1440);
  });
  getSpilloverSlots().forEach(slot => {
    addTick(0);
    addTick(slot.endMins);
  });
}

function drawSlotLabels() {
  const g = document.getElementById('slotLabels');
  g.innerHTML = '';

  const addLabel = (label, midMins, fill) => {
    const aMid = minsToAngle(midMins);
    const p = polar(aMid, 103);
    const aMidDeg = aMid * 180 / Math.PI;
    const rightHalf = Math.cos(aMid) >= 0;
    const rot    = rightHalf ? aMidDeg : aMidDeg + 180;
    const anchor = rightHalf ? 'end'   : 'start';
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', p.x);
    txt.setAttribute('y', p.y);
    txt.setAttribute('text-anchor', anchor);
    txt.setAttribute('dominant-baseline', 'central');
    txt.setAttribute('font-family', 'DM Sans, sans-serif');
    txt.setAttribute('font-size', '7.5');
    txt.setAttribute('font-weight', '600');
    txt.setAttribute('fill', fill);
    txt.setAttribute('letter-spacing', '0.08em');
    txt.setAttribute('transform', `rotate(${rot}, ${p.x}, ${p.y})`);
    txt.setAttribute('pointer-events', 'none');
    txt.textContent = label.toUpperCase();
    g.appendChild(txt);
  };

  slots.forEach(slot => {
    const dur = getDurationForSlot(slot);
    if (dur < 45) return;
    const midMins = ((slot.startMins + dur / 2) % 1440 + 1440) % 1440;
    const isSelected = slot.id === selectedSlotId;
    addLabel(slot.label, midMins, isSelected ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.28)');
  });

  getSpilloverSlots().forEach(slot => {
    if (slot.endMins < 45) return;
    addLabel(slot.label, slot.endMins / 2, 'rgba(255,255,255,0.18)');
  });
}

// ---- Build static ticks & labels ----
function buildTicks() {
  const g = document.getElementById('ticks');
  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * TAU - Math.PI / 2;
    const major = i % 4 === 0;
    const inner = R - 15 + (major ? 0 : 5);
    const outer = R + 15 - (major ? 0 : 5);
    const p1 = polar(a, inner), p2 = polar(a, outer);
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', p1.x); l.setAttribute('y1', p1.y);
    l.setAttribute('x2', p2.x); l.setAttribute('y2', p2.y);
    l.setAttribute('stroke', major ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.07)');
    l.setAttribute('stroke-width', major ? 1.5 : 1);
    g.appendChild(l);
  }
}

function buildLabels() {
  const g = document.getElementById('hrLabels');
  [
    ['12AM', -Math.PI / 2],
    ['6AM',  0],
    ['12PM', Math.PI / 2],
    ['6PM',  Math.PI],
  ].forEach(([txt, a]) => {
    const p = polar(a, 147);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y);
    t.textContent = txt;
    g.appendChild(t);
  });
}

// ---- Render ----
function render() {
  drawSlotArcs();
  drawSlotLabels();

  const slot = getSelectedSlot();
  if (!slot) {
    document.getElementById('lblStart2').textContent = '—';
    document.getElementById('lblEnd2').textContent   = '—';
    document.getElementById('durMain').textContent   = '—';
    document.getElementById('durSub').textContent    = '';
    document.getElementById('midnight').classList.remove('show');
    document.getElementById('arcFill').setAttribute('d', '');
    document.getElementById('arcHit').setAttribute('d', '');
    const off = -500;
    ['hs','hsDot','he','heDot','stickHandle','stickDot'].forEach(id => {
      document.getElementById(id).setAttribute('cx', off);
      document.getElementById(id).setAttribute('cy', off);
    });
    const sl = document.getElementById('stickLine');
    sl.setAttribute('x1', off); sl.setAttribute('y1', off);
    sl.setAttribute('x2', off); sl.setAttribute('y2', off);
    return;
  }

  const sm = slot.startMins;
  const em = slot.endMins;
  const dur = getDurationForSlot(slot);
  const crossesMidnight = em < sm || (em === sm);

  document.getElementById('lblStart2').textContent = formatTime(sm);
  document.getElementById('lblEnd2').textContent   = formatTime(em);
  document.getElementById('durMain').textContent  = formatDur(dur);
  document.getElementById('durSub').textContent   = `${dur} minute${dur !== 1 ? 's' : ''} total`;
  document.getElementById('midnight').classList.toggle('show', crossesMidnight);

  const aS = minsToAngle(sm);
  const aE = minsToAngle(em);
  const p1 = polar(aS), p2 = polar(aE);

  const largeArc = dur > 720 ? 1 : 0;
  const arcD = `M ${p1.x} ${p1.y} A ${R} ${R} 0 ${largeArc} 1 ${p2.x} ${p2.y}`;
  document.getElementById('arcFill').setAttribute('d', arcD);
  document.getElementById('arcHit').setAttribute('d', arcD);

  // Night shade arc
  const nightEl = document.getElementById('nightArc');
  if (sunriseMins !== null && sunsetMins !== null) {
    const aRise = minsToAngle(sunriseMins);
    const aSet  = minsToAngle(sunsetMins);
    const pRise = polar(aRise);
    const pSet  = polar(aSet);
    const nightSpan = ((sunriseMins - sunsetMins) + 1440) % 1440;
    const nightLarge = nightSpan > 720 ? 1 : 0;
    nightEl.setAttribute('d', `M ${pSet.x} ${pSet.y} A ${R} ${R} 0 ${nightLarge} 1 ${pRise.x} ${pRise.y}`);
    nightEl.style.display = '';
  } else {
    nightEl.style.display = 'none';
  }

  // Handles
  [['hs','hsDot', aS],['he','heDot', aE]].forEach(([id,dotId,a]) => {
    const p = polar(a);
    document.getElementById(id).setAttribute('cx', p.x);
    document.getElementById(id).setAttribute('cy', p.y);
    document.getElementById(dotId).setAttribute('cx', p.x);
    document.getElementById(dotId).setAttribute('cy', p.y);
  });

  const midMins = ((sm + dur / 2) % 1440 + 1440) % 1440;
  const aMid = minsToAngle(midMins);
  const pStickInner = polar(aMid, R + 16);
  const pStickOuter = polar(aMid, R + 36);
  document.getElementById('stickLine').setAttribute('x1', pStickInner.x);
  document.getElementById('stickLine').setAttribute('y1', pStickInner.y);
  document.getElementById('stickLine').setAttribute('x2', pStickOuter.x);
  document.getElementById('stickLine').setAttribute('y2', pStickOuter.y);
  document.getElementById('stickHandle').setAttribute('cx', pStickOuter.x);
  document.getElementById('stickHandle').setAttribute('cy', pStickOuter.y);
  document.getElementById('stickDot').setAttribute('cx', pStickOuter.x);
  document.getElementById('stickDot').setAttribute('cy', pStickOuter.y);
}

// ---- Hit testing ----
const svg = document.getElementById('dial');

function getEventAngle(e) {
  const rect = svg.getBoundingClientRect();
  const scale = 310 / rect.width;
  const src = e.touches ? e.touches[0] : e;
  const x = (src.clientX - rect.left) * scale - CX;
  const y = (src.clientY - rect.top) * scale - CY;
  return Math.atan2(y, x);
}

function getEventRadius(e) {
  const rect = svg.getBoundingClientRect();
  const scale = 310 / rect.width;
  const src = e.touches ? e.touches[0] : e;
  const x = (src.clientX - rect.left) * scale - CX;
  const y = (src.clientY - rect.top) * scale - CY;
  return Math.sqrt(x * x + y * y);
}

function getEventSVGXY(e) {
  const rect = svg.getBoundingClientRect();
  const scale = 310 / rect.width;
  const src = e.touches ? e.touches[0] : e;
  return [(src.clientX - rect.left) * scale, (src.clientY - rect.top) * scale];
}

function isOnArc(angle, radius) {
  const slot = getSelectedSlot();
  if (!slot) return false;
  // Check radius is within ring band
  if (radius < R - 22 || radius > R + 22) return false;

  const normA = ((angle + Math.PI / 2) % TAU + TAU) % TAU;
  const normS = ((minsToAngle(slot.startMins) + Math.PI / 2) % TAU + TAU) % TAU;
  const normE = ((minsToAngle(slot.endMins) + Math.PI / 2) % TAU + TAU) % TAU;

  let span = normE - normS;
  if (span <= 0) span += TAU;

  let fromStart = normA - normS;
  if (fromStart < 0) fromStart += TAU;

  return fromStart <= span;
}

function isOnHandle(angle, handleAngle) {
  return Math.abs(angleDiff(angle, handleAngle)) < 0.18; // ~10 deg
}

function determineTarget(e) {
  const slot = getSelectedSlot();
  if (!slot) return null;
  const a = getEventAngle(e);
  const r = getEventRadius(e);
  const [ex, ey] = getEventSVGXY(e);

  const slotDur = getDurationForSlot(slot);
  const midMins = ((slot.startMins + slotDur / 2) % 1440 + 1440) % 1440;
  const pStick = polar(minsToAngle(midMins), R + 36);
  const dStick = Math.sqrt((ex - pStick.x) ** 2 + (ey - pStick.y) ** 2);
  if (dStick < 22) return 'arc';

  const aS = minsToAngle(slot.startMins);
  const aE = minsToAngle(slot.endMins);

  if (r > R - 26 && r < R + 26) {
    const dS = Math.abs(angleDiff(a, aS));
    const dE = Math.abs(angleDiff(a, aE));
    const handleThresh = 0.22;
    if (dS < handleThresh && dS <= dE) return 'start';
    if (dE < handleThresh && dE < dS) return 'end';
  }

  if (isOnArc(a, r)) return 'arc';

  return null;
}

// ---- Drag handlers ----
let pointerDownNoTarget = false;

function onDown(e) {
  e.preventDefault();
  const target = determineTarget(e);
  if (!target) {
    const _r = getEventRadius(e);
    pointerDownNoTarget = _r < R - 20 || _r > R + 16;
    return;
  }
  pointerDownNoTarget = false;

  const slot = getSelectedSlot();
  if (!slot) return;

  dragMode = target;
  dragStartAngle = getEventAngle(e);
  dragStartSM = slot.startMins;
  dragStartEM = slot.endMins;

  if (dragMode === 'arc') {
    document.getElementById('arcHit').style.cursor = 'grabbing';
    document.getElementById('stickHandle').style.cursor = 'grabbing';
  } else {
    const hid = dragMode === 'start' ? 'hs' : 'he';
    document.getElementById(hid).style.cursor = 'grabbing';
  }
}

function onMove(e) {
  if (!dragMode) return;
  e.preventDefault();

  const slot = getSelectedSlot();
  if (!slot) return;

  const a = getEventAngle(e);

  if (dragMode === 'start') {
    slot.startMins = snapTo(angleToMins(a));
  } else if (dragMode === 'end') {
    slot.endMins = snapTo(angleToMins(a));
  } else if (dragMode === 'arc') {
    const delta = angleDiff(a, dragStartAngle);
    const deltaMins = (delta / TAU) * 1440;
    slot.startMins = snapTo(((dragStartSM + deltaMins) % 1440 + 1440) % 1440);
    slot.endMins = snapTo(((dragStartEM + deltaMins) % 1440 + 1440) % 1440);
  }

  saveSlots();
  render();
  updateSlotList();
}

function onUp() {
  if (pointerDownNoTarget) {
    pointerDownNoTarget = false;
    selectedSlotId = null;
    updateSlotList();
    render();
    return;
  }
  pointerDownNoTarget = false;
  dragMode = null;
  document.getElementById('arcHit').style.cursor = 'grab';
  document.getElementById('hs').style.cursor = 'grab';
  document.getElementById('he').style.cursor = 'grab';
  document.getElementById('stickHandle').style.cursor = 'grab';
}

svg.addEventListener('mousedown', onDown);
svg.addEventListener('touchstart', onDown, { passive: false });

window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('mouseup', onUp);
window.addEventListener('touchend', onUp);

// ---- Sun markers ----
function renderSunMarkers() {
  const g = document.getElementById('sunMarkers');
  g.innerHTML = '';
  if (sunriseMins === null || sunsetMins === null) return;

  [sunriseMins, sunsetMins].forEach(mins => {
    const a = minsToAngle(mins);
    const p1  = polar(a, R + 16);
    const p2  = polar(a, R + 27);
    const pTxt = polar(a, R + 52);

    const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    tick.setAttribute('x1', p1.x); tick.setAttribute('y1', p1.y);
    tick.setAttribute('x2', p2.x); tick.setAttribute('y2', p2.y);
    tick.setAttribute('stroke', 'rgba(255,210,80,0.55)');
    tick.setAttribute('stroke-width', '1.5');
    tick.setAttribute('stroke-linecap', 'round');
    g.appendChild(tick);

    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', pTxt.x); lbl.setAttribute('y', pTxt.y);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('dominant-baseline', 'central');
    lbl.setAttribute('font-family', 'DM Mono, monospace');
    lbl.setAttribute('font-size', '9');
    lbl.setAttribute('fill', 'rgba(255,210,80,0.45)');
    lbl.textContent = formatTime(mins);
    g.appendChild(lbl);
  });
}

// ---- Daylight info ----
function updateDaylightInfo() {
  const timeEl = document.getElementById('daylightTime');
  const noteEl = document.getElementById('daylightNote');

  if (sunriseMins === null || sunsetMins === null) {
    timeEl.textContent = '';
    noteEl.style.display = '';
    return;
  }

  noteEl.style.display = 'none';

  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const isDaytime = nowMins >= sunriseMins && nowMins < sunsetMins;

  if (isDaytime) {
    const remaining = sunsetMins - nowMins;
    timeEl.textContent = `${formatDur(remaining)} of daylight left`;
  } else {
    let toSunrise = sunriseMins - nowMins;
    if (toSunrise <= 0) toSunrise += 1440;
    timeEl.textContent = `${formatDur(toSunrise)} until sunrise`;
  }
}

// ---- Sun times ----
async function loadSunTimes() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async ({ coords }) => {
    try {
      const res = await fetch(
        `https://api.sunrise-sunset.org/json?lat=${coords.latitude}&lng=${coords.longitude}&formatted=0`
      );
      const data = await res.json();
      if (data.status !== 'OK') return;
      const toLocalMins = iso => {
        const d = new Date(iso);
        return d.getHours() * 60 + d.getMinutes();
      };
      sunriseMins = toLocalMins(data.results.sunrise);
      sunsetMins  = toLocalMins(data.results.sunset);
      render();
      renderSunMarkers();
      updateDaylightInfo();
    } catch (_) {}
  }, () => {});
}

// ---- Init ----
buildTicks();
buildLabels();
updateScheduleBar();
updateSlotList();
render();
loadSunTimes();
setInterval(updateDaylightInfo, 60000);
</script>
